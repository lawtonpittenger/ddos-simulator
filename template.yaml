AWSTemplateFormatVersion: "2010-09-09"
Description: "Template to provision resources required to simulate a DDoS attack on your own AWS resource"


Parameters:
  AttackResource:
    Description: URL of resource to be DDoS'd. (MUST include http:// or https:// in URL)
    Type: String

Resources:

### Build Resources ###

  SourceCodeBucket:
    Type: AWS::S3::Bucket

  PushSourceCodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
        Version: '2012-10-17'
      Path: "/"
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource: arn:aws:logs:*:*:*
          Version: '2012-10-17'
        PolicyName: 'cw-logs-access'
      - PolicyDocument:
          Statement:
          - Action:
            - s3:PutObject
            - s3:DeleteObject
            - s3:List*
            Effect: Allow
            Resource:
            - !Sub arn:aws:s3:::${SourceCodeBucket}/*
            - !Sub arn:aws:s3:::${SourceCodeBucket}
          Version: '2012-10-17'
        PolicyName: 'lambda-s3-access'


  PushSourceCodeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Push source code to S3"
      Handler: index.handler
      Role: !GetAtt PushSourceCodeRole.Arn
      Timeout: 360
      Runtime: python3.9
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      s3 = boto3.client('s3')
                      bucket = event['ResourceProperties']['BucketName']

                      # Upload Dockerfile
                      dockerfile_content = '''
          # Grab Python3.12 Lambda base image
          FROM public.ecr.aws/lambda/python:3.12.2024.01.05.15

          # Install required tools
          RUN dnf update -y
          RUN dnf install -y git golang

          # Clone and build Ddosify Engine
          RUN git clone https://github.com/getanteon/anteon.git /var/task/anteon
          WORKDIR /var/task/anteon/ddosify_engine
          RUN go build -o ddosify_engine

          # Move the binary to a location in PATH
          RUN cp ddosify_engine /usr/local/bin/
          RUN chmod +x /usr/local/bin/ddosify_engine

          # Copy function code
          COPY lambda_function.py ${LAMBDA_TASK_ROOT}

          # Set the CMD to your handler 
          CMD [ "lambda_function.handler" ]
                      '''
                      s3.put_object(Bucket=bucket, Key='Dockerfile', Body=dockerfile_content)

                      # Upload lambda_function.py
                      lambda_content = '''
          import json
          import subprocess
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              try:
                  # Get parameters from environment variables
                  target = os.environ['TARGET_URL']
                  duration = int(os.environ['DURATION_SECONDS'])
                  requests_per_second = int(os.environ['REQUESTS_PER_SECOND'])
                  user_agent = 'DemoAttack'
                  load_type = 'waved'
                  
                  # Calculate total number of requests
                  total_requests = requests_per_second * duration
                  
                  # Log the attack parameters
                  logger.info(f"Starting DDoS simulation against {target}")
                  logger.info(f"Duration: {duration}s, RPS: {requests_per_second}, Total requests: {total_requests}")
                  logger.info(f"User-Agent: {user_agent}, Load type: {load_type}")
                  
                  # Construct the ddosify command to match the original CLI pattern
                  cmd = [
                      "ddosify_engine",
                      "-n", str(total_requests),
                      "-d", str(duration),
                      "-h", f"User-Agent: {user_agent}",
                      "-t", target,
                      "-l", load_type
                  ]
                  
                  # Execute the command
                  logger.info(f"Executing command: {' '.join(cmd)}")
                  result = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True
                  )
                  
                  # Log the output
                  logger.info(f"Command output: {result.stdout}")
                  if result.stderr:
                      logger.warning(f"Command errors: {result.stderr}")
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'message': 'DDoS simulation completed',
                          'target': target,
                          'duration': duration,
                          'requests_per_second': requests_per_second,
                          'total_requests': total_requests,
                          'user_agent': user_agent,
                          'load_type': load_type,
                          'output': result.stdout,
                          'errors': result.stderr
                      })
                  }
              
              except Exception as e:
                  logger.error(f"Error executing DDoS simulation: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({
                          'message': 'Error executing DDoS simulation',
                          'error': str(e)
                      })
                  }
                      '''
                      s3.put_object(Bucket=bucket, Key='lambda_function.py', Body=lambda_content)

                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})


  PushSourceCodeCustomResource:
    Type: Custom::PushSourceCode
    Properties:
      ServiceToken: !GetAtt PushSourceCodeFunction.Arn
      BucketName: !Ref SourceCodeBucket

  ECRRepo:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true

  # Code Build Project role
  CodeBuildRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'codebuild.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/CloudWatchFullAccess'
      Policies:
        - PolicyName: 'ECRPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:CompleteLayerUpload'
                  - 'ecr:InitiateLayerUpload'
                  - 'ecr:PutImage'
                  - 'ecr:UploadLayerPart'
                Resource:
                  - !GetAtt ECRRepo.Arn
              - Effect: 'Allow'
                Action:
                  - 'ecr:GetAuthorizationToken'
                Resource:
                  - '*'
        - PolicyName: 'CodeBuildAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - "codeconnections:*"
                Resource:
                  - '*'
        - PolicyName: 'S3Access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 's3:*'
                Resource:
                  - !Sub arn:aws:s3:::${SourceCodeBucket}/*
                  - !Sub arn:aws:s3:::${SourceCodeBucket}

  
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    DependsOn:
      - PushSourceCodeCustomResource
    Properties:
      Source:
        Type: S3
        Location: !Sub ${SourceCodeBucket}/
        BuildSpec: 
          !Sub
            - |
              version: 0.2

              phases:
                pre_build:
                  commands:
                    - aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
                build:
                  commands:
                    - docker build -t ${ECRRepo} .
                    - docker tag ${ECRRepo}:latest ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepo}:latest  
                post_build:
                  commands:
                    - docker push ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepo}:latest
            - {ECRRepo: !Ref ECRRepo}
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:2.0
        ComputeType: BUILD_GENERAL1_SMALL
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS


  # IAM Policy to allow various AWS services to log events to CloudWatch logs
  LogsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
            Resource: 'arn:aws:logs:*:*:*'

  # DDoS Simulation Lambda Role
  DDoSLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: Role for DDoS Lambda
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceEventsRole
      Policies:
        - PolicyName: DDoSLambdaRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
                - ecr:GetAuthorizationToken
                - ecr:BatchCheckLayerAvailability
                - ecr:GetDownloadUrlForLayer
                - ecr:BatchGetImage
              Resource: !GetAtt ECRRepo.Arn

  # DDoS Simulation Lambda - Runs Docker image created by CodeBuild project
  DDOSLambdaFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      Code:
        ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepo}:latest"
      PackageType: Image
      Role: !GetAtt DDoSLambdaRole.Arn
      MemorySize: 10240
      Timeout: 300
      Environment:
        Variables:
          TARGET_URL: !Ref AttackResource
          DURATION_SECONDS: '60'
          REQUESTS_PER_SECOND: '10000'
    DependsOn:
      - BuildCodeCustomResource
      - CodeBuildProject



### Custom Resource ###

  BuildCodeCustomResource:
    Type: Custom::BuildCode
    Properties:
      ServiceToken: !GetAtt BuildCodeCustomResourceFunction.Arn

  BuildCodeCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
        Version: '2012-10-17'
      Path: "/"
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - codebuild:StartBuild
            - codebuild:BatchGetBuilds
            Effect: Allow
            Resource:
            - '*'
          Version: '2012-10-17'
        PolicyName: CodeBuildPolicy


  # Lambda function which builds Docker image and pushes it to ECR 
  BuildCodeCustomResourceFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      Handler: index.handler
      Role: !GetAtt BuildCodeCustomResourceRole.Arn
      Timeout: 360
      Runtime: python3.9
      Environment:
        Variables:
          PROJECT: !Ref CodeBuildProject      
      Code:
        ZipFile: !Sub |
          import boto3
          import os
          from time import sleep
          import cfnresponse

          def handler(event, context):
              
              if event['RequestType'] == 'Create':

                client = boto3.client("codebuild")
                
                status = 'STARTING'
                while status != 'SUCCEEDED':
                  if status in ['STARTING', 'STOPPED', 'FAILED', 'TIMED_OUT', 'FAULT']:
                    build_id = client.start_build(projectName=os.environ['PROJECT'])['build']['id']
                    print(build_id)
                  sleep(30)
                  status = client.batch_get_builds(ids=[build_id])['builds'][0]['buildStatus']
                  print(status)

              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})